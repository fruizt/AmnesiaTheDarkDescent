# RTX Remix settings for the Amnesia spike. run-windows.ps1 -Remix points
# Remix here with DXVK_RTX_CONFIG_FILE (otherwise Remix reads rtx.conf from the
# working directory, the game folder). Options: RtxOptions.md in dxvk-remix.

# Remix's default "new GUI input method" creates an overlay window that registers
# the keyboard as raw input with RIDEV_NOLEGACY (rtx_overlay_window.cpp), which
# stops WM_KEYDOWN for the whole process: the game's keyboard (SDL) went dead
# while the mouse kept working. Remix only reads this at startup, so it has to
# be set here, not through SetConfigVariable.
rtx.useNewGuiInputMethod = False

# Remix blocks all game input while it thinks its UI is active (default True).
# In the game's own window it seems to think so all the time: Remix kept
# presenting new frames, but the camera didn't move after switching to RTX.
rtx.blockInputToGameInUI = False

# Amnesia's horror lives in its darkness. Auto exposure brightened dark rooms
# like a camera adjusting to them. Fixed exposure instead; brightness is set by
# the lights (HPL_REMIX_LIGHT_SCALE) and this bias, in EV (+1 = twice as bright).
rtx.autoExposure.enabled = False
rtx.tonemap.exposureBias = 0

# Air for real light shafts and haze, replacing the fog cards and light-ray
# billboards that classic mode uses (left out of RTX mode). Remix's default air
# is nearly clear (99.9% transmittance over 200 m). Starting point: dusty
# indoor air, 75% of light left after 25 m, forward scattering (bright shafts
# when looking toward a light), and slowly drifting patchy density.
rtx.volumetrics.transmittanceColor = 0.75, 0.75, 0.75
rtx.volumetrics.transmittanceMeasurementDistanceMeters = 25
rtx.volumetrics.anisotropy = 0.4
rtx.volumetrics.enableHeterogeneousFog = True

# Remix's developer menu (Alt+X). Remix normally draws it onto the window it
# presents to, which is our hidden one. With this, the engine asks for it
# (dxvk_CopyRenderingOutput, GUI) and it's drawn over the frame copied to OpenGL.
rtx.gui.enableExternalPresenter = True

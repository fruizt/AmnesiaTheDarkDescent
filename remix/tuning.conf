# Live tuning for RTX mode (docs/decisions/0003: the look is set by eye).
# The game re-reads this file every second while running (run-windows.ps1
# -Remix passes its path): edit a value, save, and look. The values applied
# are logged in hpl.log ("Remix: tuning: ..."). Remix's own settings are in
# rtx.conf and its Alt+X menu.

# Brightness of every light. 1 = as bright as classic mode at half the light's
# radius (each light's power grows with the square of its radius).
light_scale = 1.0

# Brightness of what the player holds (the lantern), on top of light_scale.
# A physical light that reaches as far as classic mode's lantern (10 m) is very
# bright up close: lower this for a dimmer lantern with a shorter reach.
held_light_scale = 1.0

# Size of the lantern's light source, in meters (a flame is about 0.05).
# Larger = softer light and shadows, and less glare up close.
held_light_radius = 0.05

# How strongly glow maps shine (the lantern's glass, flames, glowing objects).
# Changing it rebuilds the materials, so expect a short hitch.
emissive_intensity = 1.0
